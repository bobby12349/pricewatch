name: Weekly price update

on:
  schedule:
    # PBS publishes the SPI on Fridays. Saturday 06:17 PKT, with a Monday retry
    # in case the report is published late (re-runs add nothing if up to date).
    - cron: "17 1 * * 6"
    - cron: "17 1 * * 1"
  workflow_dispatch:      # adds a "Run workflow" button on the Actions tab
    inputs:
      redeploy:
        description: "Push a commit even if no new prices (forces a Vercel redeploy)"
        type: boolean
        default: false
      make_post:
        description: "Rebuild the Instagram post even if no new prices"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: price-watch-pakistan-rechecked-final
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: pip install pypdf

      - name: Fetch latest PBS SPI prices
        run: python scripts/update_spi.py

      - name: Read Lahore fruit, vegetable & poultry rate sheets (AI)
        continue-on-error: true   # never blocks the PBS update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_punjab.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check site still builds
        run: node scripts/build-check.mjs

      - name: Build Instagram post (only when prices changed)
        id: post
        run: |
          if git diff --quiet -- data/price-history.json && [ "${{ inputs.make_post }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          cd ../instagram
          npm install --no-audit --no-fund
          CHROME_PATH="$(which google-chrome || which chromium)" node make-post.mjs

      - name: Commit and push
        run: |
          # Commit as the repo owner so Vercel deploys it.
          git config user.name "bobby12349"
          git config user.email "296196047+bobby12349@users.noreply.github.com"
          if [ "${{ steps.post.outputs.changed }}" != "true" ]; then
            if [ "${{ inputs.redeploy }}" = "true" ]; then
              git commit --allow-empty -m "Redeploy site"
              git push
            else
              echo "No new data."
            fi
            exit 0
          fi
          git add data/price-history.json public/data/price-history.json ../instagram/latest
          [ -f data/punjab-names.json ] && git add data/punjab-names.json
          git commit -m "Weekly price update (PBS + Lahore) + Instagram post ($(date -u +%Y-%m-%d))"
          git push
